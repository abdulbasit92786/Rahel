<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOGI PAY</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#1E1B4B;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:400px;
      background:#241F5A;
      padding:25px;
      border-radius:25px;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    .logo{
      background:white;
      color:#3B2EFF;
      text-align:center;
      font-size:40px;
      font-weight:bold;
      padding:15px;
      border-radius:15px;
      margin-bottom:25px;
    }

    .tabs{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .tabs button{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .login-btn{
      background:#7C3AED;
    }

    .signup-btn{
      background:#EC4899;
    }

    h2{
      margin-bottom:20px;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
    }

    .phone-box{
      display:flex;
      background:#312B70;
      border-radius:12px;
      overflow:hidden;
    }

    .phone-box select{
      background:transparent;
      border:none;
      color:white;
      padding:15px;
      outline:none;
    }

    .phone-box input{
      flex:1;
      background:transparent;
      border:none;
      color:white;
      padding:15px;
      outline:none;
    }

    input{
      width:100%;
      background:#312B70;
      border:none;
      color:white;
      padding:15px;
      border-radius:12px;
      outline:none;
    }

    .submit-btn{
      width:100%;
      border:none;
      padding:16px;
      border-radius:16px;
      background:linear-gradient(to right,#7C3AED,#EC4899);
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    .small{
      font-size:12px;
      color:#ccc;
      margin-top:5px;
    }

    #signupPage{
      display:none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">HOGI PAY</div>

  <div class="tabs">
    <button class="login-btn" onclick="showLogin()">Login</button>
    <button class="signup-btn" onclick="showSignup()">Sign Up</button>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage">

    <h2>Login Account</h2>

    <div class="input-box">
      <label>Mobile Number</label>

      <div class="phone-box">
        <select>
          <option>🇵🇰 +92</option>
          <option>🇮🇳 +91</option>
          <option>🇦🇪 +971</option>
          <option>🇺🇸 +1</option>
        </select>

        <input type="tel" placeholder="Enter mobile number">
      </div>
    </div>

    <div class="input-box">
      <label>Password</label>

      <input type="password" placeholder="Minimum 6 characters">
    </div>

    <button class="submit-btn">
      Login
    </button>

  </div>

  <!-- SIGNUP PAGE -->
  <div id="signupPage">

    <h2>Create Account</h2>

    <div class="input-box">
      <label>Mobile Number</label>

      <div class="phone-box">
        <select>
          <option>🇵🇰 +92</option>
          <option>🇮🇳 +91</option>
          <option>🇦🇪 +971</option>
          <option>🇺🇸 +1</option>
        </select>

        <input type="tel" placeholder="Enter mobile number">
      </div>

      <div class="small">
        صرف صحیح موبائل نمبر استعمال کریں
      </div>
    </div>

    <div class="input-box">
      <label>Password</label>

      <input type="password" placeholder="Create password">
    </div>

    <div class="input-box">
      <label>Referral Code</label>

      <input type="text" id="referralInput" placeholder="Optional referral code">

      <div class="small">
        اگر referral link سے آئے ہیں تو کوڈ خود بھر جائے گا
      </div>
    </div>

    <button class="submit-btn">
      Sign Up
    </button>

  </div>

</div>

<script>

function showLogin(){
  document.getElementById('loginPage').style.display='block';
  document.getElementById('signupPage').style.display='none';
}

function showSignup(){
  document.getElementById('signupPage').style.display='block';
  document.getElementById('loginPage').style.display='none';
}

/* Referral Auto Fill */

const params = new URLSearchParams(window.location.search);

const ref = params.get('ref');

if(ref){
  showSignup();
  document.getElementById('referralInput').value = ref;
}

</script>

</body>
</html>
