<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFGCoin Withdrawals</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.header{
  height:82px;padding:0 18px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid #332a18;
}
.logo{display:flex;align-items:center;gap:10px}
.coin{
  width:52px;height:52px;border-radius:50%;
  border:3px solid #d9b85b;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:13px;font-weight:bold;
  box-shadow:0 0 14px #8b6d26;
}
.brand{font-size:27px;font-weight:900;color:#e0bd59}
.menu{color:#e0bd59;font-weight:bold;font-size:16px}
.menu span{font-size:27px;margin-left:5px}

.wrap{max-width:600px;margin:auto;padding:24px 15px 35px}
h1{
  text-align:center;font-size:27px;margin:4px 0 24px;
  color:#e2bf5d;
}
.card{
  border:1px solid #5a4823;border-radius:15px;
  background:linear-gradient(145deg,#111,#050505);
  padding:19px 17px;margin-bottom:14px;
}
.label{
  color:#ddd;font-size:14px;font-weight:700;
  text-transform:uppercase;
}
.value{
  color:#e3c05f;font-size:31px;font-weight:900;margin-top:7px;
}
.today{
  border:1px solid #675225;border-radius:15px;
  background:#080808;overflow:hidden;
}
.todayHead{
  padding:17px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;
}
.date{font-size:21px;font-weight:900}
.count{color:#e3c05f;font-size:17px;font-weight:800;text-align:right}
.arrow{color:#e3c05f;font-size:22px;margin-left:8px}
.statuses{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 17px 17px;
}
.status{
  background:#111;border-radius:11px;padding:13px;text-align:center;
  border:1px solid #252525;
}
.status small{
  display:block;color:#999;font-size:11px;
  text-transform:uppercase;margin-bottom:5px;
}
.status b{font-size:22px}
.complete b{color:#fff}
.pending b{color:#e3c05f}

.moreBtn{
  width:100%;margin-top:13px;padding:14px;border-radius:12px;
  border:1px solid #765d27;background:#0c0c0c;color:#e3c05f;
  font-weight:900;font-size:15px;cursor:pointer;
}
.more{display:none;margin-top:12px}
.more.show{display:block}
.day{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 14px;margin-bottom:8px;border:1px solid #292317;
  border-radius:11px;background:#090909;
}
.day strong{font-size:16px}
.dayRight{text-align:right}
.dayRight span{display:block;color:#999;font-size:11px}
.dayRight b{color:#e3c05f;font-size:15px}
.note{text-align:center;color:#666;font-size:11px;margin-top:18px}

@media(max-width:400px){
 .brand{font-size:23px}.date{font-size:18px}
 .count{font-size:15px}.value{font-size:28px}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="coin">AFG</div>
    <div class="brand">AFGCoin</div>
  </div>
  <div class="menu">Menu <span>☰</span></div>
</header>

<main class="wrap">
  <h1>Withdrawals</h1>

  <!-- Only the pending total is shown here -->
  <div class="card">
    <div class="label">Total Pending Withdrawal</div>
    <div class="value" id="totalPending">1,000</div>
  </div>

  <!-- CURRENT DATE -->
  <div class="today">
    <div class="todayHead" onclick="toggleToday()">
      <div>
        <div class="date" id="todayDate">24th September</div>
        <div style="color:#888;font-size:12px;margin-top:4px">Today's Withdrawal</div>
      </div>
      <div class="count">
        <span id="todayTotal">1,000</span> Withdrawals
        <span class="arrow" id="arrow">⌃</span>
      </div>
    </div>

    <div class="statuses" id="todayStatus">
      <div class="status complete">
        <small>Complete</small>
        <b id="todayComplete">500</b>
      </div>
      <div class="status pending">
        <small>Pending</small>
        <b id="todayPending">500</b>
      </div>
    </div>
  </div>

  <button class="moreBtn" onclick="toggleMore()" id="moreButton">
    See More
  </button>

  <!-- Only 3 additional dates appear after See More -->
  <div class="more" id="moreList"></div>

  <div class="note">Withdrawal status is updated by the website administrator.</div>
</main>

<script>
/*
=========================================================
EDIT ONLY THIS DATA
=========================================================

The website owner can connect this section to Firebase/API
instead of these example numbers.

For the current date, change currentDateKey when needed,
or replace this whole data section with live database data.
=========================================================
*/

const currentDateKey = "2026-09-24";

const withdrawalData = {
  "2026-09-24": { label:"24th September", total:1000, complete:500, pending:500 },
  "2026-09-25": { label:"25th September", total:1200, complete:700, pending:500 },
  "2026-09-26": { label:"26th September", total:800,  complete:300, pending:500 },
  "2026-09-27": { label:"27th September", total:600,  complete:250, pending:350 }
};

/* Total pending shown at the top */
const totalPendingWithdrawal = 1000;

function setCurrentDay(){
  const d = withdrawalData[currentDateKey];
  if(!d) return;

  document.getElementById("totalPending").textContent =
    totalPendingWithdrawal.toLocaleString();

  document.getElementById("todayDate").textContent = d.label;
  document.getElementById("todayTotal").textContent = d.total.toLocaleString();
  document.getElementById("todayComplete").textContent = d.complete.toLocaleString();
  document.getElementById("todayPending").textContent = d.pending.toLocaleString();
}

function toggleToday(){
  const box=document.getElementById("todayStatus");
  const arrow=document.getElementById("arrow");
  const open=box.style.display !== "none";
  box.style.display=open ? "none" : "grid";
  arrow.textContent=open ? "⌄" : "⌃";
}

function toggleMore(){
  const list=document.getElementById("moreList");
  const button=document.getElementById("moreButton");

  if(list.classList.contains("show")){
    list.classList.remove("show");
    button.textContent="See More";
    return;
  }

  list.innerHTML="";
  const dates=Object.keys(withdrawalData)
    .filter(k=>k!==currentDateKey)
    .slice(0,3);

  dates.forEach(k=>{
    const d=withdrawalData[k];
    const row=document.createElement("div");
    row.className="day";
    row.innerHTML=`
      <div>
        <strong>${d.label}</strong>
        <div style="color:#777;font-size:11px;margin-top:3px">
          ${d.complete.toLocaleString()} Complete • ${d.pending.toLocaleString()} Pending
        </div>
      </div>
      <div class="dayRight">
        <span>Total Withdrawals</span>
        <b>${d.total.toLocaleString()}</b>
      </div>`;
    list.appendChild(row);
  });

  list.classList.add("show");
  button.textContent="Hide";
}

setCurrentDay();
</script>
</body>
</html>
